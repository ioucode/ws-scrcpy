name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # 公共 arm64 runner, public repo 免费; 原生 arm64 构建, 不需要 QEMU
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/ioucode/ws-scrcpy:latest
            ghcr.io/ioucode/ws-scrcpy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 兜底: 同时导出一份 OCI tar 作为 artifact, 万一 GHCR 拉取受阻可以直接
      # `gh run download` 到宿主再 `k3s ctr -n k8s.io images import`
      - name: Export OCI tar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          sbom: false
          tags: ghcr.io/ioucode/ws-scrcpy:latest
          outputs: type=docker,dest=/tmp/ws-scrcpy-arm64.tar
          cache-from: type=gha

      - uses: actions/upload-artifact@v4
        with:
          name: ws-scrcpy-arm64-oci
          path: /tmp/ws-scrcpy-arm64.tar
          retention-days: 7
